name: Funded open-source task
description: Share a published bounty, contributor reward or asynchronous technical challenge.
title: "[Funded task] "
labels:
  - work-inquiry
body:
  - type: markdown
    attributes:
      value: |
        I am focused on funded open-source tasks and contributor rewards, not freelance or private-client projects. Work must be written and asynchronous.

        This issue is public. Link the original task and official reward rules. Do not post credentials, private project data, personal payment details, bank information or identity documents. An inquiry is not a claim, assignment or agreement to perform work.
  - type: input
    id: task_url
    attributes:
      label: Original task URL
      description: Link the specific open issue, contributor reward or technical challenge.
      placeholder: https://github.com/owner/repository/issues/123
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
      description: What must be delivered, and how will the sponsor verify completion?
    validations:
      required: true
  - type: textarea
    id: reward
    attributes:
      label: Published reward and sponsor rules
      description: Link the official cash amount, sponsor authority, eligibility and payment-timing rules. Do not include personal payment details.
    validations:
      required: true
  - type: textarea
    id: availability
    attributes:
      label: Availability and deadline
      description: State current assignment or reservation rules, existing submissions, deadline and any required hardware or access.
    validations:
      required: true
  - type: checkboxes
    id: process
    attributes:
      label: Fit and privacy
      options:
        - label: This is a published open-source task or contributor reward, not private-client work, a freelance marketplace offer or an unpaid hiring test.
          required: true
        - label: The process is written and asynchronous, without required calls, interviews, camera, microphone or onsite attendance.
          required: true
        - label: I have included public project information only, with no secrets, payment credentials or identity documents.
          required: true
